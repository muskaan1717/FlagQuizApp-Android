# 1. Flip AndroidX master switch
android.useAndroidX=true

# 2. Give Gradle 3 GB of RAM with fast parallel garbage collection
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC

# 3. Use all your laptop's CPU cores in parallel!
org.gradle.parallel=true

# 4. Enable Gradle Build Cache
org.gradle.caching=true

# 5. Re-enable KSP incremental mode (now that the corrupt cache is gone!)
ksp.incremental=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
